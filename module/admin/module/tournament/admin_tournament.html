<article ng-controller="customstats.admin_tournament_controller">

	<section class="navbar-admin-base">
		<div class="tab" ng-show="app.user_has_right('customstats:admin_tournament:tournament')">
			<div ng-click="tab = 'tournament'">
				<span class="name">Turniere</span>
				</div>
			</div>
		<div class="tab" ng-show="app.user_has_right('customstats:admin_tournament:player')">
			<div ng-click="tab = 'player'">
				<span class="name">Spieler</span>
				</div>
			</div>
		<div class="tab">
			<div ng-click="tab = 'team'" ng-show="app.user_has_right('customstats:admin_tournament:team')">
				<span class="name">Teams</span>
				</div>
			</div>
		<div class="tab">
			<div ng-click="tab = 'schedule'" ng-show="app.user_has_right('customstats:admin_tournament:schedule')">
				<span class="name">Schedule</span>
				</div>
			</div>
		<div class="tab">
			<div ng-click="tab = 'new_game'" ng-show="app.user_has_right('customstats:admin_tournament:new_game')">
				<span class="name">Neues Spiel</span>
				</div>
			</div>
		</section>

		<div ng-if="tab == 'tournament' && app.user_has_right('customstats:admin_tournament:tournament')" ng-include="'load_template/tournament_config'"></div>
		<div ng-if="tab == 'player' && app.user_has_right('customstats:admin_tournament:player')" ng-include="'load_template/tournament_player'"></div>
		<div ng-if="tab == 'team' && app.user_has_right('customstats:admin_tournament:team')" ng-include="'load_template/tournament_team'"></div>
		<div ng-if="tab == 'schedule' && app.user_has_right('customstats:admin_tournament:schedule')" ng-include="'load_template/tournament_schedule'"></div>
		<div ng-if="tab == 'new_game' && app.user_has_right('customstats:admin_tournament:new_game')" ng-include="'load_template/tournament_new_game'"></div>

	</article>
