<article ng-controller="customstats.dashboard_controller">
	<section class="dashboard">

		<div class="header">
			<div class="headline ta-center">
				<span>Information Dashboard</span>
				</div>
			</div>

		<div class="body-header">

			<div class="information">
				<div class="box" style="min-width: 250px">
					<div class="i-history-white" style="margin-right: 1rem"></div>
					<div class="text">
						<div class="value">{{view.game_analysis.total_games}}</div>
						<hr />
						<div class="title">Customs gesamt</div>
						</div>
					</div>
				<div class="box" style="min-width: 280px">
					<div class="i-calendar-white" style="margin-right: 1rem"></div>
					<div class="text">
						<div class="value">{{view.game_analysis.last_gameDate | phpdate: 'd. M Y'}}</div>
						<hr />
						<div class="title">Letztes Custom</div>
						</div>
					</div>
				<div class="box" style="min-width: 260px">
					<div class="i-clock-white" style="margin-right: 1rem"></div>
					<div class="text">
						<div class="value">{{view.game_analysis.highest_duration}}</div>
						<hr />
						<div class="title">Längstes Custom</div>
						</div>
					</div>
				<div class="box" style="min-width: 200px">
					<div class="i-average-white" style="margin-right: 1rem"></div>
					<div class="text">
						<div class="value">{{view.game_analysis.average_duration | number: 2}}</div>
						<hr />
						<div class="title">&empty; Länge</div>
						</div>
					</div>
				</div>

			<div class="body">
				<div class="chart-box mg-bt mg-tp">
					<div class="chart-container mg-rg" style="width: 55%">
						<section class="timeline-box">
							<league-highchart class="highcharts-container" league-instance="view.instance_1" league-highchart="view.chartdata.games_played"></league-highchart>
							</section>
						</div>
					<div class="chart-container" style="width: 45%">
						<section class="timeline-box">
							<league-highchart class="highcharts-container" league-instance="view.instance_2" league-highchart="view.chartdata.duration"></league-highchart>
							</section>
						</div>
					</div>
				<div class="chart-box mg-bt">
					<div class="chart-container mg-rg" style="width: 50%">
						<section class="timeline-box">
							<league-highchart class="highcharts-container" league-instance="view.instance_3" league-highchart="view.chartdata.played_champs"></league-highchart>
							</section>
						</div>
					<div class="chart-container" style="width: 50%">
						<section class="timeline-box">
							<league-highchart class="highcharts-container" league-instance="view.instance_4" league-highchart="view.chartdata.banned_champs"></league-highchart>
							</section>
						</div>
					</div>
				<div class="chart-box">
					<div class="chart-container mg-rg" style="width: 100%;">
						<section class="timeline-box">
							<league-highchart class="highcharts-container" league-instance="view.instance_5" league-highchart="view.chartdata.kills"></league-highchart>
							</section>
						</div>
					<div class="chart-container mg-rg" style="width: 100%;">
						<section class="timeline-box">
							<league-highchart class="highcharts-container" league-instance="view.instance_6" league-highchart="view.chartdata.assists"></league-highchart>
							</section>
						</div>
					<div class="chart-container" style="width: 100%">
						<section class="timeline-box">
							<league-highchart class="highcharts-container" league-instance="view.instance_7" league-highchart="view.chartdata.cs"></league-highchart>
							</section>
						</div>
					</div>
				</div>

			</div>

		</section>

	<div class="loading-animation" ng-if="view.status == 100">
		<div class="loading">
			<div class="inner one"></div>
			<div class="inner two"></div>
			<div class="inner three"></div>
			</div>
		</div>

	</article>
