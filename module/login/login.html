<article class="nav-article-unlogged" ng-controller="customstats.login_controller">

	<header class="header-main-nav sticky top-0 z-50 w-full text-white font-mono flex justify-center">
		<div class="flex h-70 px-4 lg:pl-11 lg:pr-0 items-center self-center grow lg-pdl-11 lg-pdr-0">
			<a class="logo" href="#/dashboard">Customstats</a>
			<div class="h-full flex items-center mx-4 grow">
				<div class="items-center flex-row h-full lg-flex">
					<div class="group lg-flex xl-pd-14 h-full">

						</div>
					</div>
				</div>
			<div class="h-full flex items-center mx-4 grow ta-center xl-gap" style="justify-content: end">
				<a class="inline-block link" style="font-size: 18px" href="#/login" title="Dashboard">Login</a>
				</div>
<!-- 			<div class="h-full flex items-center mx-4 grow ta-center xl-gap" style="justify-content: end">
				<a class="inline-block link" style="font-size: 18px" href="#/register" title="Dashboard">Registrieren</a>
				</div> -->
			</div>


		</header>

	<section class="flex-box-login">
		<div class="card">
			<div class="header">
				<i class="title">Welcome back!</i>
				</div>
			<div class="body">
				<div class="input-group">
					<input type="text" placeholder="Username" ng-model="username" ng-keydown="$event.keyCode == 13 && send_login_request(username, password)" />
					</div>
				<div class="space"></div>
				<div class="input-group">
					<input type="password" placeholder="Password" ng-model="password" ng-keydown="$event.keyCode == 13 && send_login_request(username, password)" />
					</div>
				<div class="space2"></div>
				<button class="login-button" ng-disabled="!username || !password" ng-if="!error_message" ng-click="send_login_request(username, password)">Login</button>
				<a ng-href="#/register" ng-if="!error_message">Noch kein Konto?</a>
				<!-- <i class="ta-center" ng-if="!error_message" style="margin-top: 10px">Zugang ausschließlich mit bestehendem Account möglich.</i> -->
				<div class="login-error" ng-if="error_message"><span class="message">{{error_message}}</span></div>
				</div>
			</div>

		</section>

	</article>
