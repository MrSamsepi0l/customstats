<article ng-controller="customstats.register_controller">

	<header class="header-main-nav sticky top-0 z-50 w-full text-white font-mono flex justify-center">
		<div class="flex h-70 px-4 lg:pl-11 lg:pr-0 items-center self-center grow lg-pdl-11 lg-pdr-0">
			<a class="logo" href="/">Customstats</a>
			<div class="h-full flex items-center mx-4 grow">
				<div class="items-center flex-row h-full lg-flex">
					<div class="group lg-flex xl-pd-14 h-full">

						</div>
					</div>
				</div>
			<div class="h-full flex items-center mx-4 grow ta-center xl-gap" style="justify-content: end">
				<a class="inline-block link" style="font-size: 18px" href="/" title="Dashboard">Login</a>
				</div>
			</div>


		</header>

	<section class="flex-box-login">
		<div class="card" style="height: unset;">
			<div class="header">
				<i class="title">Einer der Gefährten werden</i>
				</div>
			<div class="body">
				<div class="input-group">
					<input type="text" placeholder="Username" ng-model="account.username" />
					</div>
				<div class="space"></div>
				<div class="input-group">
					<input type="text" placeholder="E-Mail" ng-model="account.email" />
					</div>
				<div class="space"></div>
				<div class="input-group">
					<input type="password" placeholder="Password" ng-model="account.auth" />
					</div>
				<div class="space"></div>
				<div class="input-group">
					<input type="password" placeholder="Password check" ng-model="account.auth_check" />
					</div>
				<div class="space"></div>
				<div class="input-group">
					<input type="text" placeholder="Dein Name" ng-model="account.real_name" />
					</div>
				<div class="space2"></div>
				<button class="login-button" ng-disabled="!account.username || !account.email || !account.auth || !account.auth_check || !account.real_name" ng-if="!error_message" ng-click="send_register_request(account)">Register</button>
				<div class="register-error" ng-if="error_message"><span class="message">{{error_message}}</span></div>
				</div>
			</div>

		</section>

	<div class="loading-animation" ng-if="status == 100">
		<div class="loading">
			<div class="inner one"></div>
			<div class="inner two"></div>
			<div class="inner three"></div>
			</div>
		</div>

	</article>
